<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Mockup — Design Studio</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.layout { flex:1; display:flex; overflow:hidden; }
.sidebar { width:260px; background:#161b22; border-right:1px solid #2d333b; padding:12px; font-size:11px; overflow:hidden; }
.group { margin-bottom:14px; }
.group h3 { font-size:10px; text-transform:uppercase; color:#8b949e; border-bottom:1px solid #2d333b; padding-bottom:4px; margin-bottom:8px; }
.tools { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.tool { padding:6px; text-align:center; background:#1c2128; border:1px solid #2d333b; border-radius:4px; font-size:10px; }
.tool.on { background:#4a90e2; color:#fff; }
.stage { flex:1; background:#0d1117; position:relative; }
.grid-bg { position:absolute; inset:0; background-image: linear-gradient(#1a2332 1px,transparent 1px), linear-gradient(90deg,#1a2332 1px,transparent 1px); background-size:24px 24px; }
.plan { position:absolute; inset:10%; border:3px solid #c9d1d9; }
.room { position:absolute; background:rgba(126,224,160,.08); border:1px dashed #7ee0a0; font-size:9px; color:#7ee0a0; padding:4px; }
.door { position:absolute; width:14px; height:6px; background:#c08552; }
.tabs { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; background:rgba(22,27,34,.9); border:1px solid #2d333b; border-radius:6px; overflow:hidden; z-index:2; }
.tabs span { padding:5px 14px; font-size:11px; }
.tabs span.on { background:#4a90e2; }
.topbar { height:44px; background:#161b22; border-bottom:1px solid #2d333b; display:flex; align-items:center; padding:0 14px; gap:10px; font-size:12px; }
.topbar .spacer { flex:1; }
.btn { padding:5px 10px; border-radius:5px; font-size:11px; border:1px solid #2d333b; background:#1c2128; color:#fff; }
.btn.primary { background:#4a90e2; border-color:#4a90e2; }
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <strong>🏗️ Design Studio</strong>
    <select style="background:#1c2128;border:1px solid #2d333b;color:#fff;border-radius:4px;padding:4px;font-size:11px;"><option>Vocational Center – Phase 1</option></select>
    <input value="Academic Block Layout" style="background:#1c2128;border:1px solid #2d333b;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;width:140px;"/>
    <span class="spacer"></span>
    <button class="btn">💾 Save</button><button class="btn">⬇ Export IFC</button><button class="btn">☁ Speckle</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="group"><h3>Template</h3><select style="width:100%;background:#1c2128;border:1px solid #2d333b;color:#fff;padding:4px;border-radius:4px;"><option>Vocational / Academic</option></select></div>
      <div class="group"><h3>Storeys</h3><div style="background:#1b2a3f;border:1px solid #4a90e2;border-radius:4px;padding:6px;margin-bottom:4px;">Ground Floor</div><div style="background:#1c2128;border:1px solid #2d333b;border-radius:4px;padding:6px;">Level 2</div></div>
      <div class="group"><h3>Draw tools</h3><div class="tools"><div class="tool">Select</div><div class="tool on">Wall</div><div class="tool">Column</div><div class="tool">Door</div><div class="tool">Window</div><div class="tool">MEP</div></div></div>
      <div class="group"><h3>Building</h3><p class="muted">Roof: Flat · Found. 0.6m</p></div>
    </aside>
    <main class="stage">
      <div class="tabs"><span class="on">2D Plan</span><span>3D View</span></div>
      <div class="grid-bg"></div>
      <div class="plan">
        <div class="room" style="left:8%;top:10%;width:35%;height:40%;">Workshop A · 84 m²</div>
        <div class="room" style="left:50%;top:10%;width:40%;height:40%;">Classroom Block · 96 m²</div>
        <div class="room" style="left:8%;top:55%;width:82%;height:35%;">Corridor / Lobby · 62 m²</div>
        <div class="door" style="left:45%;top:48%;"></div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
