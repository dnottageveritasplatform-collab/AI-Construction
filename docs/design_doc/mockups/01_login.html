<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Mockup — Login</title>
<link rel="stylesheet" href="shared.css"/>
<style>
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0E0E10; }
body::before { content:''; position:fixed; inset:0; background-image: linear-gradient(rgba(33,150,243,.04) 1px,transparent 1px), linear-gradient(90deg,rgba(33,150,243,.04) 1px,transparent 1px); background-size:40px 40px; }
.login-card { position:relative; z-index:1; width:380px; background:#1C1C1E; border:1px solid #2D2D2D; border-radius:16px; padding:36px 32px; }
.logo { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:linear-gradient(135deg,#1a3a5c,#2196F3); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; }
h1 { text-align:center; font-size:22px; margin-bottom:4px; }
.sub { text-align:center; color:#888; font-size:13px; margin-bottom:28px; }
label { display:block; font-size:11px; color:#888; margin-bottom:6px; }
input { width:100%; background:#141414; border:1px solid #333; border-radius:8px; color:#fff; padding:11px 14px; font-size:13px; margin-bottom:16px; }
.btn { width:100%; background:#2196F3; color:#fff; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:600; margin-top:8px; }
.footer { text-align:center; margin-top:24px; font-size:11px; color:#666; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">V</div>
  <h1>Veritas AI</h1>
  <p class="sub">Construction Platform — Sign in to your account</p>
  <label>Email address</label>
  <input value="instructor@btvi.edu.bs" readonly/>
  <label>Password</label>
  <input type="password" value="••••••••" readonly/>
  <button class="btn">Sign In</button>
  <p class="footer">© 2026 BTVI Vocational School · Veritas AI Platform v1.0</p>
</div>
</body>
</html>
