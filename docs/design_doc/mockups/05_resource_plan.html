<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Mockup — Resource Plan</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.tabs { display:flex; gap:0; border-bottom:1px solid #333; padding:0 20px; }
.tab { padding:10px 18px; font-size:12px; color:#888; border-bottom:2px solid transparent; }
.tab.on { color:#2196F3; border-bottom-color:#2196F3; }
.body { flex:1; display:grid; grid-template-columns:280px 1fr; gap:0; overflow:hidden; }
.kanban { background:#181818; border-right:1px solid #333; padding:12px; overflow:hidden; }
.col { margin-bottom:12px; }
.col h4 { font-size:10px; color:#888; text-transform:uppercase; margin-bottom:8px; }
.task { background:#1E1E1E; border:1px solid #333; border-radius:6px; padding:8px; font-size:10px; margin-bottom:6px; border-left:3px solid #2196F3; }
.gantt { padding:12px 16px; overflow:hidden; }
.gantt-head { display:flex; gap:2px; margin-bottom:8px; font-size:9px; color:#666; }
.gantt-row { display:flex; align-items:center; margin-bottom:6px; font-size:10px; }
.gantt-label { width:120px; color:#888; flex-shrink:0; }
.gantt-track { flex:1; height:18px; background:#1a1a1a; border-radius:3px; position:relative; }
.bar { position:absolute; height:100%; background:#2196F3; border-radius:3px; top:0; }
.bar.crit { background:#E57373; }
.bar.done { background:#4CAF50; opacity:.7; }
</style>
</head>
<body>
<div class="frame">
  <div class="nav"><span class="brand">Veritas AI Construction Platform</span><a class="on">Resource Plan</a><a>Dashboard</a></div>
  <div class="content">
    <div class="tabs"><span class="tab on">Gantt Chart</span><span class="tab">Kanban Board</span></div>
    <div class="body">
      <div class="kanban">
        <div class="col"><h4>In Progress</h4><div class="task">Steel frame — Level 2<br/><span class="muted">Due Jun 14</span></div><div class="task">MEP rough-in<br/><span class="muted">Due Jun 20</span></div></div>
        <div class="col"><h4>Not Started</h4><div class="task" style="border-left-color:#888">Cladding install</div></div>
      </div>
      <div class="gantt">
        <div class="gantt-head"><span style="width:120px"></span><span style="flex:1;display:flex;justify-content:space-between;padding:0 4px;"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span></span></div>
        <div class="gantt-row"><span class="gantt-label">Foundation</span><div class="gantt-track"><div class="bar done" style="left:2%;width:18%"></div></div></div>
        <div class="gantt-row"><span class="gantt-label">Structure</span><div class="gantt-track"><div class="bar crit" style="left:15%;width:35%"></div></div></div>
        <div class="gantt-row"><span class="gantt-label">MEP</span><div class="gantt-track"><div class="bar" style="left:42%;width:22%"></div></div></div>
        <div class="gantt-row"><span class="gantt-label">Cladding</span><div class="gantt-track"><div class="bar" style="left:58%;width:25%"></div></div></div>
        <div class="gantt-row"><span class="gantt-label">Finishing</span><div class="gantt-track"><div class="bar" style="left:75%;width:20%"></div></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
